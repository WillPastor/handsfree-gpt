name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android Lint, unit tests and debug APKs
        run: ./gradlew lint testDebugUnitTest assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandsFreeGPT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
